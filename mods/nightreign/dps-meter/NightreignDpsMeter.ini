; NightreignDpsMeter configuration reference
; Overlay.DisplayMode enum: GroupCompact | GroupDetailed | PersonalDetailed | Hidden
; Overlay.Scale enum: Small | Medium | Large | ExtraLarge
; Overlay.ShowPerformanceEmoji: 0 | 1; shows an encounter damage-share grade before each shared player name.
; Overlay.ShowTargetHealth: 0 | 1; shows current/max health for the displayed target at the right of the title row.
; Overlay.StripeSelfAndUnknownSupport: 0 | 1; draws self and unknown-source support as hatched external gain.
; Overlay.PositionX/PositionY: signed 1080p-reference pixel offset, scaled by renderHeight/1080; negative values anchor from right/bottom.
; Columns values: comma-separated enum names in display order.
; Column enum: Player, Damage, PartyPercent, DPS, RDamage, RDPS, Contrib, ExtGain, ExtGainPercent, Hits, Seconds, SessionDamage, SessionHits, Downs, Poise, Ailment, Aggro, Rescue, SessionRescue
; Unknown, duplicate, or empty column lists fall back to that view's defaults.
; DamageColors format: R,G,B where each component is an integer from 0 through 255.

; Debug.DetailedLogging: 0 | 1; enables verbose runtime logs.

[Network]
ShareOwnDps=1
[Overlay]
DisplayMode=Hidden
Scale=Small
ShowPerformanceEmoji=0
ShowTargetHealth=0
StripeSelfAndUnknownSupport=0
PositionX=-20
PositionY=280
[Columns]
GroupCompact=Player,Damage,PartyPercent,DPS,Poise,Ailment,Aggro
GroupDetailed=Player,Damage,RDamage,ExtGain,ExtGainPercent,Contrib,DPS,Hits,Seconds,SessionDamage,SessionHits,Downs,Poise,Ailment,Aggro,Rescue,SessionRescue
PersonalDetailed=Player,Damage,RDamage,ExtGain,ExtGainPercent,Contrib,DPS,Hits,Seconds,SessionDamage,SessionHits,Downs
[Hotkeys]
Mode=F5
Scale=F6
Clear=F7
[DamageColors]
